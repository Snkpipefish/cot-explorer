<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COT · Konsensus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10; --bg2:#0c0f15;
  --surface:#12151c; --surface-2:#171b24; --surface-3:#1d222d;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --fg:#e8ecf3; --fg-dim:#9aa3b2; --fg-mute:#5b6473;
  --teal:#6ee7d6; --indigo:#7c83ff; --accent:#6ee7d6;
  --up:#34d399; --up-dim:rgba(52,211,153,.16);
  --down:#fb7185; --down-dim:rgba(251,113,133,.16);
  --neu:#fbbf24; --neu-dim:rgba(251,191,36,.16);
  --warn:#fb7185;
  --radius:14px; --radius-sm:10px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); background:var(--bg); color:var(--fg);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 480px at 12% -8%, rgba(110,231,214,.07), transparent 60%),
    radial-gradient(820px 420px at 92% -4%, rgba(124,131,255,.08), transparent 60%);
  background-attachment:fixed;
  min-height:100vh;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}

/* ───── TOPBAR ───── */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(10,12,16,.72); backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1320px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand .b1{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.01em;
  background:linear-gradient(92deg,var(--teal),var(--indigo));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .b2{font-size:11px;color:var(--fg-mute);letter-spacing:.04em;margin-top:2px}
.nav{display:flex;gap:4px;margin-left:6px}
.nav a{
  font-family:var(--disp);font-weight:500;font-size:14px;color:var(--fg-dim);
  padding:7px 14px;border-radius:999px;border:1px solid transparent;transition:.16s;
}
.nav a:hover{color:var(--fg);background:var(--surface-2)}
.nav a.on{color:var(--bg);background:linear-gradient(92deg,var(--teal),var(--indigo));font-weight:600}
.state{display:flex;gap:0;margin-left:auto;flex-wrap:wrap}
.state .cell{padding:2px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;line-height:1.2}
.state .cell:first-child{border-left:0}
.state .lbl{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-mute)}
.state .val{font-family:var(--mono);font-size:12.5px;margin-top:2px;color:var(--fg)}
.state .val.up{color:var(--up)} .state .val.down{color:var(--down)} .state .val.neu{color:var(--neu)}

/* ───── LAYOUT ───── */
.wrap{max-width:1320px;margin:0 auto;padding:30px 26px 80px}
.panel{display:none;animation:fade .35s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section-hd{display:flex;align-items:baseline;gap:12px;margin:34px 0 16px}
.section-hd:first-child{margin-top:0}
.section-hd h2{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.01em}
.section-hd .sub{font-size:12.5px;color:var(--fg-mute)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}

/* ───── HERO ───── */
.hero{
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(160deg,var(--surface-2),var(--surface) 70%);
  padding:26px 28px;display:flex;gap:30px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;inset:0;background:
  radial-gradient(360px 200px at 88% 0%, rgba(124,131,255,.12), transparent 70%);pointer-events:none}
.hero h1{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.hero p{color:var(--fg-dim);font-size:13.5px;margin-top:8px;max-width:540px}
.hero-stats{display:flex;gap:0;margin-left:auto;flex-wrap:wrap}
.hstat{padding:4px 22px;border-left:1px solid var(--line);text-align:center}
.hstat:first-child{border-left:0}
.hstat .n{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1}
.hstat .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-mute);margin-top:6px}
.hstat.agree .n{color:var(--up)} .hstat.conflict .n{color:var(--down)} .hstat.single .n{color:var(--neu)}

/* ───── HEATMAP ───── */
.heat-group{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--line)}
.heat-group .glabel{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--fg-dim);text-align:right;
  border-right:2px solid var(--line-2);padding-right:14px}
.heat-cells{display:flex;gap:8px;flex-wrap:wrap}
.cell{
  position:relative;width:120px;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:9px 10px 10px;cursor:pointer;transition:.16s;background:var(--surface);overflow:hidden;
}
.cell:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.cell .csym{font-family:var(--disp);font-weight:600;font-size:13px}
.cell .cnav{font-size:10px;color:var(--fg-mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .crow{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.cell .cdir{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.04em}
.cell .cbar{height:4px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.cell .cbar > i{display:block;height:100%;border-radius:3px}
.cell.long{border-left:3px solid var(--up)} .cell.short{border-left:3px solid var(--down)}
.cell.neutral{border-left:3px solid var(--neu)} .cell.empty{border-left:3px solid var(--fg-mute);opacity:.6}
.cell.conflict{border-left:3px solid var(--down);box-shadow:0 0 0 1px rgba(251,113,133,.4) inset}
.cdir.long{color:var(--up)} .cdir.short{color:var(--down)} .cdir.neutral{color:var(--neu)} .cdir.empty{color:var(--fg-mute)}

/* agreement dots */
.adots{display:inline-flex;align-items:center;gap:0;vertical-align:middle}
.adots .d{width:7px;height:7px;border-radius:50%;background:var(--fg-mute);border:1px solid var(--fg-mute)}
.adots .d.fill-up{background:var(--up);border-color:var(--up)}
.adots .d.fill-down{background:var(--down);border-color:var(--down)}
.adots .d.hollow{background:transparent}
.adots .ln{width:11px;height:2px;background:var(--fg-mute)}
.adots.agree .ln{background:var(--up)}
.adots.conflict .ln{background:repeating-linear-gradient(90deg,var(--down),var(--down) 2px,transparent 2px,transparent 4px)}

/* ───── CARD GRID ───── */
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{
  border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(165deg,var(--surface-2),var(--surface));
  padding:16px 18px;transition:.16s;
}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}
.card.long{border-top:3px solid var(--up)} .card.short{border-top:3px solid var(--down)}
.card.conflict{border-top:3px solid var(--down)}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-hd .nm{font-family:var(--disp);font-weight:600;font-size:17px}
.card-hd .nv{font-size:11px;color:var(--fg-mute);margin-top:1px}
.badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
.badge.long{color:var(--up);border-color:rgba(52,211,153,.5);background:var(--up-dim)}
.badge.short{color:var(--down);border-color:rgba(251,113,133,.5);background:var(--down-dim)}
.badge.neutral{color:var(--neu);border-color:rgba(251,191,36,.5);background:var(--neu-dim)}
.badge.conflict{color:var(--down);border-color:rgba(251,113,133,.6);background:var(--down-dim)}
.badge.ghost{color:var(--fg-dim)}

.card-mid{display:flex;align-items:center;gap:16px;margin:14px 0 4px}
.verdict-big{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.01em}
.verdict-big.long{color:var(--up)} .verdict-big.short{color:var(--down)} .verdict-big.neutral{color:var(--neu)}
.gauge{flex:0 0 auto}
.gauge text{font-family:var(--mono)}

.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:4px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--fg-mute)}
.kv .v.up{color:var(--up)} .kv .v.down{color:var(--down)}

.src-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}
.src-row .tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--fg-mute);width:62px;flex:0 0 auto}
.src-row .pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px}
.src-row .pill.long{color:var(--up);background:var(--up-dim)} .src-row .pill.short{color:var(--down);background:var(--down-dim)}
.src-row .pill.none{color:var(--fg-mute);background:var(--surface-3)}
.src-row .meta{color:var(--fg-dim);font-family:var(--mono);font-size:11px;margin-left:auto}

/* ───── DRILL-DOWN ───── */
.back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--fg-dim);
  padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.16s;margin-bottom:18px}
.back:hover{color:var(--fg);border-color:var(--line-2)}
.dd-hd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.dd-hd h1{font-family:var(--disp);font-weight:700;font-size:32px;letter-spacing:-.02em}
.dd-hd .sub{color:var(--fg-mute);font-size:13px;padding-bottom:5px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.cols.tri{grid-template-columns:repeat(3,1fr)}
.cols-3{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.br-evi{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px}
.br-evi .ev{font-family:var(--mono);font-size:11px;color:var(--fg-mute)}
.br-evi .ev b{color:var(--fg);font-weight:600}
.br-pass{color:var(--up)} .br-fail{color:var(--neu)}
.rg-note{font-family:var(--mono);font-size:10.5px;color:var(--fg-mute);margin-top:8px;line-height:1.4}

/* mirrored driver bars */
.fam-row{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line)}
.fam-row:last-child{border-bottom:0}
.fam-row .name{text-align:center;font-family:var(--mono);font-size:11px;color:var(--fg-dim);letter-spacing:.03em}
.fam-bar{height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden;display:flex}
.fam-bar.l{justify-content:flex-end}
.fam-bar > i{height:100%;display:block;border-radius:5px}
.fam-bar.l > i{background:linear-gradient(90deg,transparent,var(--teal))}
.fam-bar.r > i{background:linear-gradient(90deg,var(--indigo),transparent)}

.legend{display:flex;gap:18px;font-size:11px;color:var(--fg-mute);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* price chart */
.chart-box{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px}
svg.price{width:100%;height:300px;display:block}
.pl-line{fill:none;stroke:var(--teal);stroke-width:1.6}
.pl-area{fill:url(#parea)}
.pl-grid{stroke:var(--line);stroke-width:1}
.pl-lvl{stroke-width:1;stroke-dasharray:4 3}
.pl-txt{font-family:var(--mono);font-size:10px;fill:var(--fg-mute)}

/* narrative */
.narr{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--radius-sm);
  background:var(--surface);padding:14px 18px;font-size:14px;color:var(--fg-dim);line-height:1.6}

/* ───── MATRISE ───── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fbtn{font-family:var(--mono);font-size:11px;color:var(--fg-dim);padding:6px 12px;border:1px solid var(--line);
  border-radius:999px;cursor:pointer;transition:.16s}
.fbtn:hover{color:var(--fg);border-color:var(--line-2)}
.fbtn.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.mx-card{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:12px 14px}
.mx-card.long{border-left:3px solid var(--up)} .mx-card.short{border-left:3px solid var(--down)}
.mx-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mx-hd .nm{font-family:var(--disp);font-weight:600;font-size:14px}
.mx-hd .hz{font-family:var(--mono);font-size:10px;color:var(--teal);letter-spacing:.08em;text-transform:uppercase}
.mx-dir{display:flex;align-items:center;gap:8px;margin:8px 0 6px}
.mx-arrow{font-family:var(--mono);font-weight:700;font-size:22px}
.mx-arrow.long{color:var(--up)} .mx-arrow.short{color:var(--down)}
.mx-bar{height:6px;background:var(--surface-3);border-radius:4px;position:relative;overflow:hidden}
.mx-bar > i{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--indigo),var(--teal))}
.mx-bar > .thr{position:absolute;top:-2px;width:2px;height:10px;background:var(--fg)}
.mx-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--fg-mute);margin-top:6px}

/* ───── DATA ───── */
.pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcell{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:13px 15px}
.pcell .pn{font-family:var(--disp);font-weight:600;font-size:14px}
.pcell .pt{font-family:var(--mono);font-size:11px;color:var(--fg-mute);margin-top:3px}
.pcell .ps{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:6px;margin-top:8px;border:1px solid var(--line-2)}
.ps.fresh{color:var(--up);border-color:rgba(52,211,153,.4)} .ps.stale{color:var(--neu);border-color:rgba(251,191,36,.4)}
.ps.miss{color:var(--fg-mute)}

footer{max-width:1320px;margin:30px auto 0;padding:18px 26px 30px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;color:var(--fg-mute);font-size:12px;flex-wrap:wrap;gap:10px}
footer .mono{font-size:11px}

.empty-note{color:var(--fg-mute);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius-sm)}

@media(max-width:900px){
  .cols,.cols-3,.cols-2{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start}
  .hero-stats{margin-left:0}
}
@media(max-width:780px){
  .wrap{padding:22px 14px 60px} .topbar-inner{padding:12px 14px;gap:14px}
  .state{width:100%;margin-left:0;order:3} .nav{order:2}
  .heat-group{grid-template-columns:1fr;gap:8px}
  .heat-group .glabel{text-align:left;border-right:0;border-bottom:1px solid var(--line-2);padding:0 0 4px}
  .cell{width:calc(50% - 4px)}
  .hero h1{font-size:24px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="b1">COT · Konsensus</span>
      <span class="b2">tre motorer · ett verdikt</span>
    </div>
    <nav class="nav" id="nav">
      <a href="#/konsensus" data-tab="konsensus">Konsensus</a>
      <a href="#/matrise" data-tab="matrise">Matrise</a>
      <a href="#/regnbue" data-tab="regnbue">Regnbue</a>
      <a href="#/data" data-tab="data">Datakvalitet</a>
    </nav>
    <div class="state" id="state"></div>
  </div>
</header>

<main class="wrap">
  <section class="panel on" id="panel-konsensus"></section>
  <section class="panel" id="panel-instrument"></section>
  <section class="panel" id="panel-matrise"></section>
  <section class="panel" id="panel-regnbue"></section>
  <section class="panel" id="panel-data"></section>
</main>

<footer>
  <span id="colophon">COT-observatorium · bedrock × cot-explorer × regnbue</span>
  <span class="mono" id="colostamp">— · —</span>
</footer>

<script>
/* ════════════════════════════════════════════════════════════
   COT · KONSENSUS — "Nordlys"
   To signalmotorer (bedrock + cot-explorer) forsonet per instrument.
   ════════════════════════════════════════════════════════════ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

/* ──── KONSTANTER ──── */
const ASSET_GROUPS = [
  { key:'valuta', label:'Valuta',     items:['EURUSD','GBPUSD','USDJPY','AUDUSD'] },
  { key:'metaller', label:'Metaller', items:['Gold','Silver','Platinum','Copper'] },
  { key:'energi', label:'Energi',     items:['WTI','Brent','NatGas'] },
  { key:'indekser', label:'Indekser', items:['SPX','NAS100'] },
  { key:'korn', label:'Korn',         items:['Corn','Wheat','Soybean'] },
  { key:'softs', label:'Softs',       items:['Cotton','Sugar','Coffee','Cocoa'] },
  { key:'krypto', label:'Krypto',     items:['BTC','ETH'] },
];
const INSTRUMENT_NAVN_NO = {
  'EURUSD':'Euro/Dollar','GBPUSD':'Pund/Dollar','USDJPY':'Dollar/Yen','AUDUSD':'Aussie/Dollar',
  'Gold':'Gull','Silver':'Sølv','Platinum':'Platina','Copper':'Kobber',
  'WTI':'WTI råolje','Brent':'Brent råolje','NatGas':'Naturgass',
  'SPX':'S&P 500','NAS100':'Nasdaq 100',
  'Corn':'Mais','Wheat':'Hvete','Soybean':'Soyabønner',
  'Cotton':'Bomull','Sugar':'Sukker','Coffee':'Kaffe','Cocoa':'Kakao',
  'BTC':'Bitcoin','ETH':'Ether',
};
const PRICE_FILE = {
  'EURUSD':'eurusd','GBPUSD':'gbpusd','USDJPY':'usdjpy','AUDUSD':'audusd',
  'Gold':'gold','Silver':'silver','WTI':'wti','Brent':'brent',
  'SPX':'spx','NAS100':'nas100','Corn':'corn','Wheat':'wheat','Soybean':'soybean',
  'Cotton':'cotton','Sugar':'sugar','Coffee':'coffee','Cocoa':'cocoa',
};

/* ──── DATA LOADER (gjenbrukt) ──── */
const D = {};
async function loadJSON(path){
  try{ const r = await fetch(path,{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
}
async function loadAll(){
  const [interpretation, prices, signals, agri_signals, latest, macro, fundamentals,
         bedrockIndex, fundamentalsB, comex, eiaStorage, cropProgress, iriEnso,
         cryptoSentiment, newsIntel, diseaseAlerts, exportEvents,
         oilgas, shipping, geointel, calendar,
         bedrockSignals, bedrockAgriSignals, bdi, tff, regnbue] = await Promise.all([
    loadJSON('data/cot_interpretation/latest.json'),
    loadJSON('data/bedrock/prices.json'),
    loadJSON('data/signals.json'),
    loadJSON('data/agri_signals.json'),
    loadJSON('data/latest.json'),
    loadJSON('data/macro/latest.json'),
    loadJSON('data/fundamentals/latest.json'),
    loadJSON('data/bedrock/index.json'),
    loadJSON('data/bedrock/fundamentals.json'),
    loadJSON('data/bedrock/comex.json'),
    loadJSON('data/bedrock/eia_storage.json'),
    loadJSON('data/bedrock/crop_progress.json'),
    loadJSON('data/bedrock/iri_enso.json'),
    loadJSON('data/bedrock/crypto_sentiment.json'),
    loadJSON('data/bedrock/news_intel.json'),

}

/* ──── FORMAT ──── */
function fmtPrice(v,d){
  if(v==null||!Number.isFinite(v)) return '—';
  if(d==null){ const a=Math.abs(v); d = a>=1000?1 : a>=10?2 : 4; }
  return Number(v).toFixed(d);
}
function fmtPct(v){ if(v==null) return '—'; return (v>0?'+':'')+Number(v).toFixed(1)+'%'; }
function dirNo(dir){ return dir==='LONG'?'LONG':dir==='SHORT'?'SHORT':'—'; }
function dirClass(dir){ return dir==='LONG'?'long':dir==='SHORT'?'short':'neutral'; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

/* ──── JOIN-HJELPERE (gjenbrukt) ──── */
function signalFor(symbol){
  const p = (D.signals?.signals||[]).find(s=>s.key===symbol);
  if(p) return p;
  return (D.agri_signals?.signals||[]).find(s=>s.key===symbol) || null;
}
const BEDROCK_SYMBOL_MAP = { 'WTI':'CrudeOil','NAS100':'Nasdaq','SPX':'SP500','NatGas':'NaturalGas' };
function bedrockSymbol(sym){ return BEDROCK_SYMBOL_MAP[sym]||sym; }
function bedrockEntriesFor(symbol){
  const bs = bedrockSymbol(symbol);
  const all = (D.bedrockSignals||[]).concat(D.bedrockAgriSignals||[]);
  return all.filter(e=>e.instrument===bs);
}
const bedRatio = e => e.min_score_publish>0 ? (e.score/e.min_score_publish) : 0;
function bestBedrockEntry(symbol){
  const e = bedrockEntriesFor(symbol);
  if(!e.length) return null;
  const pub = e.filter(x=>x.published);
  if(pub.length) return pub.sort((a,b)=>bedRatio(b)-bedRatio(a))[0];
  return e.sort((a,b)=>bedRatio(b)-bedRatio(a))[0];
}
// Regnbue uses its own instrument labels for a handful of symbols
const REGNBUE_SYMBOL_MAP = { 'SPX':'SP500','NAS100':'Nasdaq','BTC':'BTCUSD','ETH':'ETHUSD' };
function regnbueSymbol(sym){ return REGNBUE_SYMBOL_MAP[sym]||sym; }
function bestRegnbueEntry(symbol){
  const rs = regnbueSymbol(symbol);
  return (D.regnbueSignals||[]).find(e=>e.instrument===rs) || null;
}
const regGrade = g => (g && g!=='NONE') ? g : null;

/* ──── FORENT DATAMODELL — kjernen ──── */
function normDir(d){
  if(!d) return null;
  const s = String(d).toLowerCase();
  if(s==='buy'||s==='long'||s==='bull') return 'LONG';
  if(s==='sell'||s==='short'||s==='bear') return 'SHORT';
  return null;
}
function unifyInstrument(symbol){
  const s = signalFor(symbol);
  const be = bestBedrockEntry(symbol);
  const re = bestRegnbueEntry(symbol);
  const interp = D.interpretation?.assets?.[symbol] || null;

  let cot=null;
  if(s){
    const pct = s.score_pct!=null ? s.score_pct
              : (s.max_score ? Math.round((s.score/s.max_score)*100) : null);
    cot = { dir:normDir(s.action), scorePct: pct, grade:s.grade||null,
            setup:{entry:s.entry, sl:s.sl, t1:s.t1, t2:s.t2, current:s.current, rr:s.rr_t1},
            drivers:s.driver_groups||null, raw:s };
  }
  let bed=null;
  if(be){
    const ratio = bedRatio(be);
    const su = be.setup?.setup || {};
    bed = { dir:normDir(be.direction), ratio, pct:clamp(Math.round(ratio*70),0,100),
            grade:be.grade||null, published:!!be.published, horizon:be.horizon,
            setup:{entry:su.entry, sl:su.sl, tp:su.tp}, families:be.families||null,
            analog:be.analog||null, raw:be };
  }
  let reg=null;
  if(re){
    reg = { dir:normDir(re.direction), score:re.score,
            pct:clamp(Math.round(Math.abs(re.score||0)*100),0,100),
            grade:regGrade(re.grade), published:!!re.published,
            setup:{entry:re.entry, sl:re.sl, tp:re.tp, rr:re.rr},
            baseRate:re.base_rate||null, drivers:re.drivers||null,
            reject:re.reject_reason||null, raw:re };
  }

  // forsoning over de motorene som faktisk har et syn (1–3)
  const engines = [cot, bed, reg].filter(Boolean);
  const dirs = engines.map(e=>e.dir).filter(Boolean);
  const uniq = [...new Set(dirs)];
  let status, verdict=null, conviction=0;
  if(!engines.length){ status='NØYTRAL'; }
  else {
    if(dirs.length>=2 && uniq.length===1){ status='ENIGHET'; verdict=uniq[0]; }
    else if(dirs.length>=2 && uniq.length>1){ status='KONFLIKT'; verdict=null; }
    else if(dirs.length===1){ status='EN_KILDE'; verdict=dirs[0]; }
    else { status='NØYTRAL'; }
    const pcts = engines.map(e=>e.scorePct ?? e.pct ?? 0);
    conviction = Math.round(pcts.reduce((a,b)=>a+b,0)/engines.length);
  }

  return { symbol, name:INSTRUMENT_NAVN_NO[symbol]||symbol, cot, bed, reg, interp, status, verdict, conviction };
}
const STATUS_LBL = {
  ENIGHET:'Enighet', KONFLIKT:'Konflikt', EN_KILDE:'Én kilde', 'NØYTRAL':'Nøytral'
};
// antall motorer som faktisk peker i verdikt-retningen (0–3)
function nAgreeing(u){ return [u.cot,u.bed,u.reg].filter(e=>e&&e.dir===u.verdict).length; }
function enginesWithView(u){ return [u.cot,u.bed,u.reg].filter(e=>e&&e.dir).length; }

/* ──── VIZ-HJELPERE ──── */
function color(dir){ return dir==='LONG'?'var(--up)':dir==='SHORT'?'var(--down)':'var(--neu)'; }
function arc(pct,r,cx,cy){
  // semisirkel 180°(venstre)→0°(høyre), fyll proporsjonalt
  const a0=180, a1=180-(clamp(pct,0,100)/100)*180;
  const rad=d=>d*Math.PI/180;
  const p=(deg)=>[cx+r*Math.cos(rad(deg)), cy-r*Math.sin(rad(deg))];
  const [x0,y0]=p(a0), [x1,y1]=p(a1);
  return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function gauge(pct, dir, size){
  size = size||132; const h=Math.round(size*0.62);
  const cx=size/2, cy=h-8, r=size/2-12;
  const col = color(dir);
  return `<svg class="gauge" width="${size}" height="${h}" viewBox="0 0 ${size} ${h}">
    <path d="${arc(100,r,cx,cy)}" fill="none" stroke="var(--surface-3)" stroke-width="9" stroke-linecap="round"/>
    <path d="${arc(pct,r,cx,cy)}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"/>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="22" font-weight="600" fill="${col}">${Math.round(pct)}</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="9" fill="var(--fg-mute)">KONVIKSJON</text>
  </svg>`;
}
function adots(u){
  // bedrock ●—● cot ●—● regnbue
  const cls = u.status==='ENIGHET'?'agree' : u.status==='KONFLIKT'?'conflict' : '';
  const fill = e => e ? (e.dir==='LONG'?'fill-up' : e.dir==='SHORT'?'fill-down' : 'hollow') : 'hollow';
  return `<span class="adots ${cls}" title="bedrock · cot-explorer · regnbue">
    <span class="d ${fill(u.bed)}"></span><span class="ln"></span><span class="d ${fill(u.cot)}"></span><span class="ln"></span><span class="d ${fill(u.reg)}"></span></span>`;
}
function gradeBadge(g){ return g?`<span class="badge ghost">${g}</span>`:''; }

/* ════════ KONSENSUS-LANDING ════════ */
function renderKonsensus(){
  const all = ASSET_GROUPS.flatMap(g=>g.items).map(unifyInstrument);
  const nAgree = all.filter(u=>u.status==='ENIGHET').length;
  const nConf  = all.filter(u=>u.status==='KONFLIKT').length;
  const nSingle= all.filter(u=>u.status==='EN_KILDE').length;

  // hero
  let h = `<div class="hero">
    <div>
      <div class="eyebrow">tre motorer forsonet</div>
      <h1>Konsensus-tavle</h1>
      <p>Bedrock, cot-explorer og regnbue scorer hvert instrument uavhengig. Her ser du hvor de er
         <b style="color:var(--up)">enige</b> (sterkest signal), hvor de er
         <b style="color:var(--down)">uenige</b> (konflikt), og hvor bare én motor har et syn.</p>
    </div>
    <div class="hero-stats">
      <div class="hstat agree"><div class="n">${nAgree}</div><div class="l">Enige</div></div>
      <div class="hstat conflict"><div class="n">${nConf}</div><div class="l">Konflikter</div></div>
      <div class="hstat single"><div class="n">${nSingle}</div><div class="l">Én kilde</div></div>
    </div>
  </div>`;

  // heatmap
  h += `<div class="section-hd"><h2>Varmekart</h2><span class="sub">retning · konviksjon · enighet — klikk for dybde</span></div>`;
  h += `<div>`;
  for(const g of ASSET_GROUPS){
    h += `<div class="heat-group"><div class="glabel">${g.label}</div><div class="heat-cells">`;
    for(const sym of g.items){ h += heatCell(unifyInstrument(sym)); }
    h += `</div></div>`;
  }
  h += `</div>`;
  h += `<div class="legend">
    <span><i style="background:var(--up)"></i>Long</span>
    <span><i style="background:var(--down)"></i>Short</span>
    <span><i style="background:var(--neu)"></i>Nøytral / kun én kilde</span>
    <span>${adots({status:'ENIGHET',cot:{dir:'LONG'},bed:{dir:'LONG'},reg:{dir:'LONG'}})} enige</span>
    <span>${adots({status:'KONFLIKT',cot:{dir:'LONG'},bed:{dir:'SHORT'},reg:{dir:'LONG'}})} uenige</span>
  </div>`;

  // konflikter
  const conflicts = all.filter(u=>u.status==='KONFLIKT');
  h += `<div class="section-hd"><h2>Konflikter</h2><span class="sub">motorene peker i hver sin retning</span></div>`;
  if(conflicts.length){
    h += `<div class="grid cards">` + conflicts.map(conflictCard).join('') + `</div>`;
  } else {
    h += `<div class="empty-note">Ingen direkte konflikter akkurat nå — der begge motorer har et syn er de samstemte.</div>`;
  }

  // sterkeste enighet — full 3-veis enighet først, deretter 2-av-3, så konviksjon
  const agree = all.filter(u=>u.status==='ENIGHET' && u.verdict)
    .sort((a,b)=> nAgreeing(b)-nAgreeing(a) || b.conviction-a.conviction);
  const nFull = agree.filter(u=>nAgreeing(u)>=3).length;
  h += `<div class="section-hd"><h2>Sterkeste enighet</h2><span class="sub">${nFull} med alle tre motorer · rangert etter antall enige motorer, så konviksjon</span></div>`;
  if(agree.length){
    h += `<div class="grid cards">` + agree.map(agreeCard).join('') + `</div>`;
  } else {
    h += `<div class="empty-note">Ingen instrumenter har samstemt signal fra flere motorer akkurat nå.</div>`;
  }
  $('#panel-konsensus').innerHTML = h;
}

function heatCell(u){
  const dc = u.status==='KONFLIKT' ? 'conflict'
           : u.verdict==='LONG' ? 'long' : u.verdict==='SHORT' ? 'short'
           : u.status==='NØYTRAL' ? 'empty' : 'neutral';
  const dirTxt = u.status==='KONFLIKT' ? 'KONFLIKT'
               : u.verdict ? dirNo(u.verdict)
               : u.status==='NØYTRAL' ? '—' : 'NØYTRAL';
  const dcol = u.verdict==='LONG'?'var(--up)':u.verdict==='SHORT'?'var(--down)':'var(--neu)';
  const barW = u.status==='NØYTRAL'?0:clamp(u.conviction,0,100);
  return `<a class="cell ${dc}" href="#/instrument/${u.symbol}">
    <div class="csym">${u.symbol}</div>
    <div class="cnav">${u.name}</div>
    <div class="crow">
      <span class="cdir ${dc}">${dirTxt}</span>
      ${adots(u)}
    </div>
    <div class="cbar"><i style="width:${barW}%;background:${dcol}"></i></div>
  </a>`;
}

function srcRow(tag, src, kind){
  if(!src || !src.dir){
    return `<div class="src-row"><span class="tag">${tag}</span><span class="pill none">ingen</span></div>`;
  }
  const meta = kind==='bed'
    ? `${src.published?'publisert':'under terskel'} · ${src.horizon||''} · ×${src.ratio.toFixed(2)}`
    : kind==='reg'
    ? `${src.published?'publisert':'avvist'}${src.grade?' · '+src.grade:''}${src.baseRate?` · n=${src.baseRate.n}`:''}`
    : `score ${src.scorePct!=null?src.scorePct+'%':'—'}${src.grade?' · '+src.grade:''}`;
  return `<div class="src-row"><span class="tag">${tag}</span>
    <span class="pill ${dirClass(src.dir)}">${dirNo(src.dir)}</span>
    <span class="meta">${meta}</span></div>`;
}

function conflictCard(u){
  return `<a class="card click conflict" href="#/instrument/${u.symbol}">
    <div class="card-hd">
      <div><div class="nm">${u.symbol}</div><div class="nv">${u.name}</div></div>
      <span class="badge conflict">Konflikt</span>
    </div>
    <div style="margin-top:10px">
      ${srcRow('bedrock', u.bed, 'bed')}
      ${srcRow('cot-expl.', u.cot, 'cot')}
      ${srcRow('regnbue', u.reg, 'reg')}
    </div>
  </a>`;
}

function agreeCard(u){
  const lvls = u.cot?.setup || u.reg?.setup || u.bed?.setup || {};
  const tp = lvls.t1 ?? lvls.tp;
  const nAg = nAgreeing(u);
  const silent = [['cot-expl.',u.cot],['bedrock',u.bed],['regnbue',u.reg]]
    .filter(([n,e])=>!e||!e.dir).map(([n])=>n);
  const full = nAg>=3;
  const sub = full ? 'alle tre motorer enige'
    : `${nAg} av 3 enige${silent.length?` · stille: ${silent.join(', ')}`:''}`;
  return `<a class="card click ${dirClass(u.verdict)}" href="#/instrument/${u.symbol}">
    <div class="card-hd">
      <div><div class="nm">${u.symbol}</div><div class="nv">${u.name}</div></div>
      ${adots(u)}
    </div>
    <div class="card-mid">
      ${gauge(u.conviction, u.verdict, 120)}
      <div>
        <div class="verdict-big ${dirClass(u.verdict)}">${dirNo(u.verdict)}</div>
        <div style="margin-top:6px"><span class="badge ${full?'long':'ghost'}">${nAg}/3 motorer</span></div>
        <div style="font-family:var(--mono);font-size:10.5px;color:var(--fg-mute);margin-top:4px">${sub}</div>
      </div>
    </div>
    ${lvls.entry!=null?`<div style="margin-top:8px">
      <div class="kv"><span class="k">Entry</span><span class="v">${fmtPrice(lvls.entry)}</span></div>
      <div class="kv"><span class="k">Stop</span><span class="v down">${fmtPrice(lvls.sl)}</span></div>
      <div class="kv"><span class="k">Mål</span><span class="v up">${fmtPrice(tp)}</span></div>
    </div>`:''}
  </a>`;
}

function srcDetail(src, kind){

  else if(src.scorePct!=null) h += `<span class="meta" style="font-family:var(--mono);font-size:11px;color:var(--fg-mute)">score ${src.scorePct}%</span>`;
  h += `</div>`;
  const su = src.setup||{};
  const tp = su.t1 ?? su.tp;
  if(su.entry!=null || su.sl!=null){
    h += `<div class="kv"><span class="k">Entry</span><span class="v">${fmtPrice(su.entry)}</span></div>
      <div class="kv"><span class="k">Stop</span><span class="v down">${fmtPrice(su.sl)}</span></div>
      <div class="kv"><span class="k">Mål</span><span class="v up">${fmtPrice(tp)}</span></div>`;

  return h;
}
function regBaseRate(src){
  const br = src.baseRate;
  let h = '';
  if(br){
    const hr = br.hit_rate!=null ? (br.hit_rate*100).toFixed(0)+'%' : '—';
    const hrci = br.hit_rate_ci ? `${(br.hit_rate_ci[0]*100).toFixed(0)}–${(br.hit_rate_ci[1]*100).toFixed(0)}%` : '';
    const ex = br.expectancy_r!=null ? (br.expectancy_r>=0?'+':'')+br.expectancy_r.toFixed(2)+'R' : '—';
    const exci = br.expectancy_ci ? `${br.expectancy_ci[0].toFixed(2)}…${br.expectancy_ci[1].toFixed(2)}` : '';
    h += `<div class="br-evi">
      <span class="ev">analoger <b>n=${br.n ?? '—'}</b></span>
      <span class="ev ${br.passes?'br-pass':'br-fail'}">${br.passes?'består':'under terskel'}</span>
      <span class="ev">treffrate <b>${hr}</b>${hrci?` <span style="opacity:.7">(${hrci})</span>`:''}</span>
      <span class="ev">forventning <b>${ex}</b>${exci?` <span style="opacity:.7">(${exci})</span>`:''}</span>
    </div>`;
  }
  if(!src.published && src.reject) h += `<div class="rg-note">⚠ ${src.reject}</div>`;
  return h;
}

const FAM_NO = { trend:'Trend', positioning:'Posisjonering', macro:'Makro', fundamental:'Fundamentalt', structure:'Struktur', risk:'Risiko', analog:'Analog' };
function famCompare(u){
  const cg = u.cot?.drivers || {};
  const bf = u.bed?.families || {};
  const keys = ['trend','positioning','macro','fundamental','structure','risk','analog'];
  const rows = keys.filter(k=>cg[k]!=null || bf[k]!=null);
  if(!rows.length) return null;
  let h='';
  for(const k of rows){
    const cv = cg[k]?.score!=null ? clamp(cg[k].score,0,1) : null;       // 0..1
    const bv = bf[k]?.score!=null ? clamp(bf[k].score,0,1) : null;       // 0..1
    h += `<div class="fam-row">
      <div class="fam-bar l">${cv!=null?`<i style="width:${(cv*100).toFixed(0)}%"></i>`:''}</div>
      <div class="name">${FAM_NO[k]||k}</div>
      <div class="fam-bar r">${bv!=null?`<i style="width:${(bv*100).toFixed(0)}%"></i>`:''}</div>
    </div>`;
  }
  return h + `<div class="legend"><span><i style="background:var(--teal)"></i>cot-explorer</span><span><i style="background:var(--indigo)"></i>bedrock</span></div>`;
}

async function drawChart(symbol, u){
  const stem = PRICE_FILE[symbol];
  const box = $('#chartBox'); if(!box) return;
  if(!stem){ box.innerHTML = `<div class="empty-note">Ingen prishistorikk for ${symbol}.</div>`; return; }
  const j = await loadJSON('data/prices/'+stem+'.json');
  const rows = (j?.data || j?.rows || (Array.isArray(j)?j:[])).slice(-260);
  if(!rows.length){ box.innerHTML = `<div class="empty-note">Ingen prisdata.</div>`; return; }
  const vals = rows.map(r=>r.price ?? r.close ?? r.c).filter(v=>v!=null);
  const su = u.cot?.setup || u.reg?.setup || u.bed?.setup || {};
  const lvls = [
    {v:su.entry, c:'var(--teal)', t:'Entry'},
    {v:su.sl, c:'var(--down)', t:'Stop'},
    {v:su.t1 ?? su.tp, c:'var(--up)', t:'Mål'},
  ].filter(l=>l.v!=null && Number.isFinite(l.v));
  let lo=Math.min(...vals), hi=Math.max(...vals);
  for(const l of lvls){ lo=Math.min(lo,l.v); hi=Math.max(hi,l.v); }
  const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
  const W=1000,H=300,mL=8,mR=64,mT=10,mB=18;
  const x=i=> mL + i*(W-mL-mR)/(vals.length-1);
  const y=v=> mT + (1-(v-lo)/(hi-lo))*(H-mT-mB);
  let path=''; vals.forEach((v,i)=>{ path += (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; });
  const area = path + `L ${x(vals.length-1).toFixed(1)} ${(H-mB).toFixed(1)} L ${mL} ${(H-mB).toFixed(1)} Z`;
  let svg = `<svg class="price" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="parea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--teal)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--teal)" stop-opacity="0"/>
    </linearGradient></defs>`;
  for(let g=0; g<=4; g++){
    const gy=mT+g*(H-mT-mB)/4, gv=hi-(g/4)*(hi-lo);
    svg += `<line class="pl-grid" x1="${mL}" y1="${gy}" x2="${W-mR}" y2="${gy}"/>
      <text class="pl-txt" x="${W-mR+5}" y="${gy+3}">${fmtPrice(gv)}</text>`;
  }
  svg += `<path class="pl-area" d="${area}"/><path class="pl-line" d="${path}"/>`;
  for(const l of lvls){
    const ly=y(l.v);
    svg += `<line class="pl-lvl" x1="${mL}" y1="${ly}" x2="${W-mR}" y2="${ly}" stroke="${l.c}"/>
      <text class="pl-txt" x="${mL+3}" y="${ly-3}" fill="${l.c}">${l.t} ${fmtPrice(l.v)}</text>`;
  }
  svg += `</svg>`;
  box.innerHTML = svg;
}

/* ════════ MATRISE (bedrock power-view) ════════ */
let mxFilter = { klasse:'alle', horisont:'alle', status:'alle' };
function renderMatrise(){
  const all = (D.bedrockSignals||[]).concat(D.bedrockAgriSignals||[]);
  let h = `<div class="section-hd"><h2>Bedrock-matrise</h2><span class="sub">alle ${all.length} setup · horisont × retning</span></div>`;
  h += `<div class="filters" id="mxFilters">
    ${fgroup('klasse',[['alle','Alle'],['fx','Valuta'],['metal','Metall'],['energy','Energi'],['index','Indeks'],['ag','Landbruk'],['crypto','Krypto']])}
  </div>
  <div class="filters">
    ${fgroup('horisont',[['alle','Alle horisonter'],['makro','Makro'],['swing','Swing'],['scalp','Scalp']])}
    ${fgroup('status',[['alle','Alle'],['publisert','Publisert']])}
  </div>`;
  let rows = all.slice();
  if(mxFilter.klasse!=='alle') rows = rows.filter(e=>classOf(e)===mxFilter.klasse);
  if(mxFilter.horisont!=='alle') rows = rows.filter(e=>(e.horizon||'').toLowerCase()===mxFilter.horisont);
  if(mxFilter.status==='publisert') rows = rows.filter(e=>e.published);
  rows.sort((a,b)=>bedRatio(b)-bedRatio(a));
  h += `<div class="grid cards">` + rows.map(mxCard).join('') + `</div>`;
  $('#panel-matrise').innerHTML = h;
  $$('#panel-matrise .fbtn').forEach(b=>b.addEventListener('click',()=>{
    mxFilter[b.dataset.f]=b.dataset.v; renderMatrise();
  }));
}
function classOf(e){
  const c=(e.asset_class||'').toLowerCase();
  if(['fx','currency'].includes(c)) return 'fx';
  if(['metal','metals','precious'].includes(c)) return 'metal';
  if(['energy','oilgas'].includes(c)) return 'energy';
  if(['index','equity','indices'].includes(c)) return 'index';
  if(['crypto'].includes(c)) return 'crypto';
  if(['ag','agri','agriculture','grain','grains','soft','softs'].includes(c)) return 'ag';
  return c || 'alle';
}
function fgroup(f, opts){
  return opts.map(([v,l])=>`<span class="fbtn ${mxFilter[f]===v?'on':''}" data-f="${f}" data-v="${v}">${l}</span>`).join('');
}
function mxCard(e){
  const dir=normDir(e.direction); const ratio=bedRatio(e);
  const sym = e.instrument;
  return `<div class="mx-card ${dirClass(dir)}">
    <div class="mx-hd"><span class="nm">${sym}</span><span class="hz">${e.horizon||''}</span></div>
    <div class="mx-dir">
      <span class="mx-arrow ${dirClass(dir)}">${dir==='LONG'?'▲':dir==='SHORT'?'▼':'·'}</span>
      <span class="badge ${dirClass(dir)}">${dirNo(dir)}</span>
      ${gradeBadge(e.grade)}
      ${e.published?'<span class="badge ghost" style="color:var(--up);border-color:rgba(52,211,153,.4)">publisert</span>':''}
    </div>
    <div class="mx-bar"><i style="width:${clamp(ratio/1.5*100,0,100).toFixed(0)}%"></i><span class="thr" style="left:66%"></span></div>
    <div class="mx-meta"><span>score ${e.score?.toFixed(2)??'—'}</span><span>terskel ${e.min_score_publish??'—'}</span></div>
  </div>`;
}

/* ════════ REGNBUE (base-rate-setups) ════════ */
const REGNBUE_TO_COT = Object.fromEntries(Object.entries(REGNBUE_SYMBOL_MAP).map(([c,r])=>[r,c]));
function cotSymbolFor(regInstr){ return REGNBUE_TO_COT[regInstr] || regInstr; }
let rgFilter = { grade:'alle', status:'alle' };
function renderRegnbue(){
  const sigs = (D.regnbueSignals||[]).slice();
  const asof = D.regnbue?.raw?.as_of || '';
  let h = `<div class="hero">
    <div>
      <div class="eyebrow">tredje motor</div>
      <h1>Regnbue-setups</h1>
      <p>Base-rate-validerte setups med nivåer (entry/stop/mål) på Skilling-feeden. Hver setup
         må bestå en <b>base-rate-gate</b> — nok historiske analoger, treffrate og forventning med
         konfidensintervall — før den publiseres. De fleste avvises ærlig; det er meningen.</p>
    </div>
    <div class="hero-stats">
      <div class="hstat agree"><div class="n">${sigs.filter(s=>s.published).length}</div><div class="l">Publisert</div></div>
      <div class="hstat single"><div class="n">${sigs.length}</div><div class="l">Vurdert</div></div>
    </div>
  </div>`;
  if(!sigs.length){
    h += `<div class="empty-note">Ingen regnbue-data lastet ennå (data/regnbue/setups.json mangler).</div>`;
    $('#panel-regnbue').innerHTML = h; return;
  }
  if(asof) h += `<div class="section-hd"><h2>Setups</h2><span class="sub">per ${asof} · rangert etter styrke</span></div>`;
  h += `<div class="filters">
    ${rgFgroup('grade',[['alle','Alle'],['A+','A+'],['A','A'],['B','B']])}
    ${rgFgroup('status',[['alle','Alle'],['publisert','Publisert']])}
  </div>`;
  let rows = sigs.slice();
  if(rgFilter.grade!=='alle') rows = rows.filter(e=>e.grade===rgFilter.grade);
  if(rgFilter.status==='publisert') rows = rows.filter(e=>e.published);
  rows.sort((a,b)=>Math.abs(b.score||0)-Math.abs(a.score||0));
  h += `<div class="grid cards">` + rows.map(rgCard).join('') + `</div>`;
  $('#panel-regnbue').innerHTML = h;
  $$('#panel-regnbue .fbtn').forEach(b=>b.addEventListener('click',()=>{
    rgFilter[b.dataset.f]=b.dataset.v; renderRegnbue();
  }));
}
function rgFgroup(f, opts){
  return opts.map(([v,l])=>`<span class="fbtn ${rgFilter[f]===v?'on':''}" data-f="${f}" data-v="${v}">${l}</span>`).join('');
}
function rgCard(e){
  const dir=normDir(e.direction); const sym=cotSymbolFor(e.instrument);
  const grade=regGrade(e.grade); const br=e.base_rate;
  const tp = e.tp;
  let evi = '';
  if(br){
    const hr = br.hit_rate!=null ? (br.hit_rate*100).toFixed(0)+'%' : '—';
    const ex = br.expectancy_r!=null ? (br.expectancy_r>=0?'+':'')+br.expectancy_r.toFixed(2)+'R' : '—';
    evi = `<div class="br-evi">
      <span class="ev">n=<b>${br.n ?? '—'}</b></span>
      <span class="ev ${br.passes?'br-pass':'br-fail'}">${br.passes?'består gate':'under gate'}</span>
      <span class="ev">treff <b>${hr}</b></span>
      <span class="ev">forv. <b>${ex}</b></span>
    </div>`;
  }
  return `<a class="mx-card ${dirClass(dir)}" href="#/instrument/${sym}">
    <div class="mx-hd"><span class="nm">${sym}</span><span class="hz">${e.ticker||''}</span></div>
    <div class="mx-dir">
      <span class="mx-arrow ${dirClass(dir)}">${dir==='LONG'?'▲':dir==='SHORT'?'▼':'·'}</span>
      <span class="badge ${dirClass(dir)}">${dirNo(dir)}</span>
      ${gradeBadge(grade)}
      ${e.published?'<span class="badge ghost" style="color:var(--up);border-color:rgba(52,211,153,.4)">publisert</span>':''}
    </div>
    ${(e.entry!=null||e.sl!=null)?`<div class="kv"><span class="k">Entry</span><span class="v">${fmtPrice(e.entry)}</span></div>
      <div class="kv"><span class="k">Stop</span><span class="v down">${fmtPrice(e.sl)}</span></div>
      <div class="kv"><span class="k">Mål</span><span class="v up">${fmtPrice(tp)}</span></div>
      <div class="kv"><span class="k">R:R</span><span class="v">${e.rr!=null?e.rr.toFixed(2):'—'}</span></div>`:''}
    ${evi}
    <div class="mx-meta"><span>score ${e.score!=null?e.score.toFixed(2):'—'}</span><span>${e.published?'':'avvist'}</span></div>
  </a>`;
}

/* ════════ DATAKVALITET ════════ */
function renderData(){
  const now = Date.now();
  const sources = [
    {n:'cot-explorer signaler', t:D.signals?.generated, src:(D.signals?.signals||[]).length+' signaler'},
    {n:'cot-explorer landbruk', t:D.agri_signals?.generated, src:(D.agri_signals?.signals||[]).length+' signaler'},
    {n:'bedrock signaler', t:D.bedrockIndex?.generated, src:(D.bedrockSignals||[]).length+' setup'},
    {n:'bedrock landbruk', t:D.bedrockIndex?.generated, src:(D.bedrockAgriSignals||[]).length+' setup'},
    {n:'regnbue setups', t:D.regnbue?.generated, src:(D.regnbueSignals||[]).length+' setup · '+(D.regnbueSignals||[]).filter(s=>s.published).length+' publ.'},
    {n:'COT-tolkning', t:D.interpretation?.generated, src:Object.keys(D.interpretation?.assets||{}).length+' instrumenter'},
    {n:'Makro / DXY', t:D.macro?.date, src:D.macro?.cot_date?('COT '+D.macro.cot_date):''},
    {n:'COMEX-lager', t:D.meta?.comex?.generated, src:(D.meta?.comex?.rows ?? 0)+' rader'},
    {n:'EIA energilager', t:D.meta?.eia?.generated, src:(D.meta?.eia?.rows ?? 0)+' rader'},
    {n:'Avlingsfremgang', t:D.meta?.crop?.generated, src:(D.cropProgress||[]).length+' rader'},
    {n:'Sykdomsvarsler', t:D.meta?.disease?.generated, src:(D.diseaseAlerts||[]).length+' varsler'},
    {n:'Værstress', t:D.meta?.export?.generated, src:(D.exportEvents||[]).length+' hendelser'},
    {n:'BDI frakt', t:D.meta?.bdi?.generated, src:(D.bdi||[]).length+' punkter'},
  ];
  let h = `<div class="section-hd"><h2>Datakvalitet</h2><span class="sub">friskhet og dekning per kilde</span></div><div class="pipe">`;
  for(const s of sources){
    let st='miss', lbl='—';
    if(s.t){
      const age = (now - new Date(s.t).getTime())/3600000;
      if(Number.isFinite(age)){ st = age<30?'fresh':'stale'; lbl = age<1?'< 1t':age<48?Math.round(age)+'t':Math.round(age/24)+'d'; }
    }
    h += `<div class="pcell"><div class="pn">${s.n}</div>
      <div class="pt">${s.src||'—'}</div>
      <span class="ps ${st}">${st==='fresh'?'fersk · '+lbl:st==='stale'?'foreldet · '+lbl:'ukjent'}</span></div>`;
  }
  h += `</div>`;
  $('#panel-data').innerHTML = h;
}

/* ════════ STATE STRIP ════════ */
function renderState(){
  const cells=[];
  const cot = D.signals?.cot_date || D.macro?.cot_date;
  if(cot) cells.push(['COT-rapport', cot, '']);
  const ds = D.macro?.dollar_smile;
  if(ds) cells.push(['USD-bias', ds.usd_bias||'—', ds.usd_color==='bull'?'up':ds.usd_color==='bear'?'down':'neu']);
  const vix = D.macro?.vix_regime;
  if(vix) cells.push(['VIX', (vix.value!=null?vix.value.toFixed(1):'—')+' · '+(vix.regime||''), vix.color==='bull'?'up':vix.color==='bear'?'down':'neu']);
  const fg = D.macro?.sentiment?.fear_greed;
  if(fg) cells.push(['Frykt/grådighet', (fg.score!=null?fg.score.toFixed(0):'—')+' '+(fg.rating||''), fg.score>=55?'up':fg.score<=45?'down':'neu']);
  const geo = D.signals?.global_state?.geo_active;
  if(geo!=null) cells.push(['Geo-risiko', geo?'aktiv':'rolig', geo?'down':'up']);
  $('#state').innerHTML = cells.map(([l,v,c])=>`<div class="cell"><span class="lbl">${l}</span><span class="val ${c}">${v}</span></div>`).join('');
  $('#colostamp').textContent = (D.signals?.generated||D.macro?.date||'—');
}

/* ════════ ROUTER ════════ */
const TABS = ['konsensus','matrise','regnbue','data'];
function showPanel(tab){
  $$('.panel').forEach(p=>p.classList.remove('on'));
  $('#panel-'+tab).classList.add('on');
  $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.tab===tab));
}
function navigate(){
  const h = location.hash || '#/konsensus';
  const parts = h.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(parts[0]==='instrument' && parts[1]){
    showPanel('instrument'); $$('#nav a').forEach(a=>a.classList.remove('on'));
    renderInstrument(decodeURIComponent(parts[1]));
    window.scrollTo({top:0});
    return;
  }
  const tab = TABS.includes(parts[0]) ? parts[0] : 'konsensus';
  showPanel(tab);
  if(tab==='konsensus') renderKonsensus();
  else if(tab==='matrise') renderMatrise();
  else if(tab==='regnbue') renderRegnbue();
  else if(tab==='data') renderData();
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', navigate);

/* ════════ INIT ════════ */
(async()=>{
  await loadAll();
  renderState();
  navigate();
})();
</script>
